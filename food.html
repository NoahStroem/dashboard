<!-- The Rowan4 kit: tokens, grain, canvas + the atmospheric backdrop -->
<link rel="stylesheet" href="components/rowan4-kit/rowan4-kit.css" />

<style>
:root{ --vk-font-serif:'Instrument Serif'; --en-mono:'JetBrains Mono',ui-monospace,monospace; }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{ background:var(--vk-bg); color:var(--vk-fg); font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; -webkit-font-smoothing:antialiased; }

.en-shell{ max-width:720px; gap:var(--vk-space-6); }
.en-header{ flex-direction:row; align-items:flex-end; justify-content:space-between; gap:var(--vk-space-4); flex-wrap:wrap; }
.en-header .vk-date{ margin-top:6px; }
.en-back{ font-family:var(--en-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--vk-mint); text-decoration:none; border:1px solid var(--vk-border-strong); border-radius:var(--vk-radius-pill); padding:8px 15px; transition:background var(--vk-duration) var(--vk-ease), border-color var(--vk-duration) var(--vk-ease); white-space:nowrap; }
.en-back:hover{ background:rgba(110,231,183,.08); border-color:rgba(110,231,183,.4); }

.en-tabs{ display:inline-flex; gap:4px; padding:4px; border:1px solid var(--vk-border); border-radius:var(--vk-radius-pill); background:var(--vk-card); align-self:flex-start; opacity:0; animation:vk-fade-up 700ms var(--vk-ease-premium) .1s forwards; }
.en-tab{ appearance:none; background:transparent; border:0; cursor:pointer; color:var(--vk-muted); font-family:var(--en-mono); font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; padding:9px 18px; border-radius:var(--vk-radius-pill); transition:color var(--vk-duration) var(--vk-ease), background var(--vk-duration) var(--vk-ease); }
.en-tab:hover{ color:var(--vk-muted-strong); }
.en-tab.on{ background:var(--vk-mint); color:#04130c; font-weight:600; }

#panel{ display:flex; flex-direction:column; }

.en-card{ border:1px solid var(--vk-border); border-radius:18px; background:var(--vk-card); padding:20px; margin-bottom:14px; opacity:0; transform:translateY(10px); animation:vk-tile-in 600ms var(--vk-ease-premium) forwards; }
.en-card:nth-child(1){ animation-delay:60ms; } .en-card:nth-child(2){ animation-delay:130ms; }
.en-card:nth-child(3){ animation-delay:200ms; } .en-card:nth-child(4){ animation-delay:270ms; }
.en-eyebrow{ font-family:var(--en-mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--vk-mint); margin:0 0 14px; display:flex; align-items:center; gap:8px; }
.en-eyebrow::before{ content:''; width:20px; height:1px; background:linear-gradient(90deg,var(--vk-mint),transparent); }

.en-input{ width:100%; appearance:none; background:rgba(255,255,255,.04); border:1px solid var(--vk-border-strong); border-radius:13px; color:var(--vk-fg); font-family:inherit; font-size:15px; padding:12px 14px; outline:none; transition:border-color var(--vk-duration) var(--vk-ease); }
.en-input:focus{ border-color:var(--vk-mint); box-shadow:0 0 0 3px rgba(110,231,183,.1); }
.en-btn{ appearance:none; cursor:pointer; border:0; border-radius:13px; padding:0 18px; font-family:var(--en-mono); font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:#04130c; background:var(--vk-mint); transition:filter var(--vk-duration) var(--vk-ease); }
.en-btn:hover{ filter:brightness(1.08); }
.en-ghost{ appearance:none; cursor:pointer; background:rgba(110,231,183,.06); border:1px solid var(--vk-border-strong); border-radius:var(--vk-radius-pill); color:var(--vk-mint); font-family:var(--en-mono); font-size:11px; letter-spacing:.06em; padding:8px 14px; transition:background var(--vk-duration) var(--vk-ease); }
.en-ghost:hover{ background:rgba(110,231,183,.13); }
.en-ghost.on{ background:var(--vk-mint); color:#04130c; border-color:transparent; font-weight:600; }
.en-muted{ font-size:13px; color:var(--vk-muted); padding:8px 2px; line-height:1.5; }
.en-del{ appearance:none; background:transparent; border:1px solid var(--vk-border); color:var(--vk-muted); width:28px; height:28px; border-radius:8px; cursor:pointer; flex-shrink:0; font-size:15px; line-height:1; }
.en-del:hover{ color:var(--vk-red); border-color:var(--vk-red); }
.en-foot{ text-align:center; font-family:var(--en-mono); font-size:10px; color:var(--vk-muted); margin-top:8px; opacity:.7; line-height:1.6; }

/* ---------- WATER ---------- */
.w-hero{ text-align:center; }
.w-visual{ position:relative; display:grid; place-items:center; height:280px; margin:6px 0 12px; }
.w-aurora{ position:absolute; width:250px; height:250px; border-radius:50%; background:radial-gradient(circle,rgba(110,231,183,.18),transparent 65%); filter:blur(8px); animation:w-pulse 6s var(--vk-ease) infinite; }
@keyframes w-pulse{ 0%,100%{ transform:scale(1); opacity:.8; } 50%{ transform:scale(1.08); opacity:1; } }
.w-particles{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.w-particle{ position:absolute; bottom:-8px; width:4px; height:4px; border-radius:50%; background:var(--vk-mint); opacity:.5; animation:w-float linear infinite; }
@keyframes w-float{ 0%{ transform:translateY(0); opacity:0; } 10%{ opacity:.6; } 90%{ opacity:.3; } 100%{ transform:translateY(-280px); opacity:0; } }
.w-ringSvg{ position:absolute; width:250px; height:250px; }
.w-ringArc{ transition:stroke-dashoffset .8s var(--vk-ease-premium); }
.w-numWrap{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:2px; transition:transform .36s var(--vk-ease-premium); }
.w-numPunch{ transform:scale(1.12); }
/* Carries a unit now ("750 ml"), so it scales to stay inside the ring. */
.w-num{ font-family:var(--vk-font-serif),Georgia,serif; font-weight:400; font-size:clamp(34px,12vw,60px); line-height:1; letter-spacing:-0.03em; font-variant-numeric:tabular-nums; white-space:nowrap; }
.w-target{ font-family:var(--en-mono); font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--vk-muted); }
.w-zone{ display:inline-flex; align-items:center; gap:6px; padding:5px 12px; background:rgba(110,231,183,.1); border:1px solid var(--vk-border-strong); border-radius:var(--vk-radius-pill); color:var(--vk-mint); font-family:var(--en-mono); font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; margin:0 auto 12px; }
.w-helper{ text-align:center; font-size:14px; color:var(--vk-muted-strong); margin:0 0 16px; }
.w-helper.good{ color:var(--vk-mint); }
/* One box for everything — parses what you type and sends it to the right tab. */
.qb{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; margin:0 0 10px; }
.qbInput{ min-width:0; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.10); border-radius:12px; padding:14px 16px; color:#fff; font-family:inherit; font-size:15px; outline:none; transition:border-color .18s, box-shadow .18s; }
.qbInput::placeholder{ color:rgba(255,255,255,.38); }
.qbInput:focus{ border-color:rgba(110,231,183,.45); box-shadow:0 0 0 3px rgba(110,231,183,.10); }
.qbBtn{ appearance:none; border:0; border-radius:12px; padding:0 22px; background:#6EE7B7; color:#04130c; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; transition:filter .18s; }
.qbBtn:hover{ filter:brightness(1.08); }
.qbSugs{ display:flex; flex-direction:column; gap:2px; margin:0 0 10px; padding:6px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.09); border-radius:12px; }
.qbSug{ appearance:none; display:flex; align-items:baseline; justify-content:space-between; gap:12px; width:100%; text-align:left; background:transparent; border:0; border-radius:9px; padding:10px 12px; color:#fff; font-family:inherit; font-size:14px; cursor:pointer; transition:background .14s; }
.qbSug:hover,.qbSug:focus-visible{ background:rgba(110,231,183,.12); outline:none; }
.qbSugName{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.qbSugMeta{ flex:none; font-family:var(--en-mono),ui-monospace,monospace; font-size:11px; color:rgba(255,255,255,.5); }
.qbFeedback{ min-height:0; margin:0 0 14px; font-size:13px; line-height:1.5; }
.qbFeedback:empty{ margin:0; }
.qbOk{ color:#6EE7B7; } .qbMiss{ color:rgba(255,255,255,.55); }
.qbWhere{ font-family:var(--en-mono),ui-monospace,monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; opacity:.75; margin-right:8px; }
.w-quickRow{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-bottom:10px; }
.w-quick{ appearance:none; padding:12px 6px; border-radius:11px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.10); color:#fff; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; transition:border-color .18s, background .18s; }
.w-quick:hover{ border-color:rgba(110,231,183,.4); background:rgba(110,231,183,.10); }
.w-actions{ display:grid; grid-template-columns:auto 1fr; gap:10px; }
.w-undo{ appearance:none; width:56px; border-radius:13px; background:var(--vk-card-elevated); border:1px solid var(--vk-border-strong); color:var(--vk-fg); font-size:22px; line-height:1; cursor:pointer; transition:background var(--vk-duration) var(--vk-ease); }
.w-undo:hover:not(:disabled){ background:rgba(255,255,255,.08); }
.w-undo:disabled{ opacity:.3; cursor:not-allowed; }
.w-drink{ appearance:none; display:flex; align-items:center; justify-content:center; gap:10px; padding:16px; border-radius:13px; background:var(--vk-mint); border:0; color:#04130c; font-family:inherit; font-size:16px; font-weight:700; cursor:pointer; transition:filter var(--vk-duration) var(--vk-ease), box-shadow var(--vk-duration) var(--vk-ease); }
.w-drink:hover{ filter:brightness(1.08); box-shadow:0 0 26px var(--vk-mint-glow); }
.w-why{ margin-top:16px; border-top:1px solid var(--vk-border); padding-top:12px; }
.w-whyToggle{ appearance:none; width:100%; display:flex; align-items:center; justify-content:space-between; background:transparent; border:0; color:var(--vk-muted-strong); font-family:inherit; font-size:13px; cursor:pointer; padding:6px 0; }
.w-whyArrow{ transition:transform var(--vk-duration) var(--vk-ease-premium); }
.w-whyArrow.open{ transform:rotate(180deg); }
.w-whyRow{ display:flex; justify-content:space-between; gap:12px; font-size:12px; color:var(--vk-muted); padding-top:6px; }
.w-whyRow .v{ font-variant-numeric:tabular-nums; color:var(--vk-muted-strong); white-space:nowrap; }
.w-whyRow.total{ margin-top:6px; padding-top:8px; border-top:1px solid var(--vk-border); }
.w-whyRow.total .l{ color:var(--vk-fg); font-weight:600; }
.w-whyRow.total .v{ color:var(--vk-mint); font-weight:600; }
.w-spark{ display:block; width:100%; height:78px; margin:6px 0 14px; }
.w-sparkTarget{ stroke:var(--vk-border-strong); stroke-width:1; stroke-dasharray:3 3; }
.w-barHit{ fill:var(--vk-mint); } .w-barMiss{ fill:rgba(255,255,255,.1); }
.w-histRow{ display:grid; grid-template-columns:64px 1fr auto; align-items:center; gap:12px; margin-bottom:8px; }
.w-histDate{ font-family:var(--en-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--vk-muted); }
.w-histWrap{ height:6px; background:rgba(255,255,255,.07); border-radius:var(--vk-radius-pill); overflow:hidden; }
.w-histFill{ height:100%; background:var(--vk-mint); border-radius:var(--vk-radius-pill); transition:width .4s var(--vk-ease-premium); }
.w-histFill.miss{ background:var(--vk-border-strong); }
.w-histCount{ font-family:var(--en-mono); font-size:11px; color:var(--vk-muted-strong); font-variant-numeric:tabular-nums; min-width:34px; text-align:right; }
.w-seg{ display:inline-flex; flex-wrap:wrap; gap:4px; background:var(--vk-card); border:1px solid var(--vk-border); border-radius:var(--vk-radius-pill); padding:3px; }
.w-segBtn{ appearance:none; background:transparent; border:0; color:var(--vk-muted); font-family:inherit; font-size:12px; font-weight:600; padding:6px 14px; border-radius:var(--vk-radius-pill); cursor:pointer; }
.w-segBtn.on{ background:var(--vk-mint); color:#04130c; }
.w-setGroup{ margin-bottom:16px; }
.w-setLabel{ display:block; font-family:var(--en-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--vk-muted); margin-bottom:8px; }
.w-row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.w-field{ display:flex; flex-direction:column; gap:6px; }
.w-hint{ font-size:11px; color:var(--vk-muted); margin:6px 0 0; font-style:italic; }
.w-stimAdd{ display:grid; grid-template-columns:1fr 84px auto; gap:8px; align-items:stretch; }
.w-stimList{ display:flex; flex-direction:column; gap:6px; margin-top:12px; }
.w-stimItem{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 8px 8px 12px; background:var(--vk-card-elevated); border:1px solid var(--vk-border); border-radius:11px; }
.w-stimName{ font-size:13px; font-weight:600; }
.w-stimMg{ font-family:var(--en-mono); font-size:11px; font-weight:600; color:var(--vk-mint); margin-left:8px; }

/* ---------- FOOD / MACROS ---------- */
.f-calHead{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:14px; }
.f-calMath{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
.f-cell{ display:flex; flex-direction:column; gap:2px; }
.f-cell .n{ font-family:var(--vk-font-serif),serif; font-style:italic; font-size:30px; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
.f-cell .l{ font-family:var(--en-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--vk-muted); }
.f-op{ font-family:var(--vk-font-serif),serif; font-size:22px; color:var(--vk-muted); }
.f-cell.remain .n{ color:var(--vk-mint); }
.f-cell.remain.over .n{ color:var(--vk-red); }
.f-goalEdit{ display:flex; flex-direction:column; gap:6px; }
.f-goalEdit input{ width:104px; background:rgba(255,255,255,.04); border:1px solid var(--vk-border); border-radius:10px; padding:9px 12px; color:var(--vk-fg); font-family:inherit; font-size:14px; }
.f-goalEdit input:focus{ outline:none; border-color:var(--vk-mint); }
.f-bar{ height:9px; border-radius:var(--vk-radius-pill); background:rgba(255,255,255,.06); overflow:hidden; }
.f-barFill{ height:100%; border-radius:var(--vk-radius-pill); background:var(--vk-mint); box-shadow:0 0 12px var(--vk-mint-glow); transition:width var(--vk-duration) var(--vk-ease-premium); }
.f-barFill.over{ background:var(--vk-red); box-shadow:none; }
.f-macroGrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:16px; }
.f-box{ display:flex; flex-direction:column; gap:4px; padding:14px; border:1px solid var(--vk-border); border-radius:13px; background:var(--vk-card-elevated); }
.f-box.cal{ border-color:var(--vk-border-strong); background:rgba(110,231,183,.06); }
.f-boxVal{ font-family:var(--vk-font-serif),serif; font-style:italic; font-size:26px; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
.f-boxLabel{ font-family:var(--en-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--vk-muted); }
@media (max-width:560px){ .f-macroGrid{ grid-template-columns:repeat(2,1fr); } }
.f-results{ display:flex; flex-direction:column; gap:6px; margin-top:12px; }
.f-foodRow{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 13px; border:1px solid var(--vk-border); border-radius:12px; background:var(--vk-card-elevated); }
.f-foodName{ font-weight:600; font-size:14px; }
.f-meta{ font-family:var(--en-mono); font-size:11px; color:var(--vk-muted); margin-top:2px; }
.f-gram{ width:70px; background:rgba(255,255,255,.04); border:1px solid var(--vk-border-strong); border-radius:10px; padding:9px 10px; color:var(--vk-fg); font-family:inherit; font-size:14px; }
.f-gram:focus{ outline:none; border-color:var(--vk-mint); }
.f-add{ appearance:none; cursor:pointer; border:0; border-radius:10px; padding:9px 14px; font-family:var(--en-mono); font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:#04130c; background:var(--vk-mint); }
.f-logRow{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 13px; border:1px solid var(--vk-border); border-radius:12px; background:var(--vk-card-elevated); margin-bottom:7px; }
.f-nums{ font-family:var(--en-mono); font-size:11px; color:var(--vk-muted-strong); margin-top:2px; }

@media (prefers-reduced-motion:reduce){
  .en-card,.en-tabs{ animation:none !important; opacity:1 !important; transform:none !important; }
  .w-aurora,.w-particle,.w-ringArc,.w-barHit{ animation:none !important; transition:none !important; }
}

/* Five tabs no longer fit on a phone, so the bar scrolls sideways instead of
 * pushing the page wider. max-width beats the inline-flex intrinsic size. */
.en-tabs{ max-width:100%; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.en-tabs::-webkit-scrollbar{ display:none; }
.en-tab{ flex:none; }

<script>
/* =====================================================================
 * FOOD & WATER — Water hydration tracker + Macros food log unified into
 * one page, styled with the Rowan4 kit. Each tab reads/writes the SAME
 * localStorage keys as the originals, so data carries over both ways:
 *   water_standalone_v1 · macros_standalone_v1
 * ===================================================================== */
(function(){
'use strict';

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function round(n){ return Math.round(n); }
function getLocalDateKey(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

let activeTab='water';
const panel=document.getElementById('panel');
function renderPanel(){
  const active=document.activeElement; const aid=active?active.id:null;
  const caret=(active&&typeof active.selectionStart==='number')?active.selectionStart:null;
  panel.innerHTML=MODULES[activeTab].html();
  if(MODULES[activeTab].after)MODULES[activeTab].after();
  if(aid){ const el=document.getElementById(aid); if(el){ try{ el.focus(); if(caret!=null&&el.setSelectionRange)el.setSelectionRange(caret,caret); }catch(e){} } }
}

/* =====================================================================
 * MODULE: WATER (key: water_standalone_v1)
 * Personal hydration target from weight/exercise/caffeine/stimulants,
 * a tap-to-drink ring, "why this target", and a 14-day history.
 * ===================================================================== */
const WATER=(function(){
  const LS='water_standalone_v1';
  const STIM_OPTIONS=['Concerta','Ritalin','Methylphenidate','Vyvanse','Elvanse','Adderall','Adderall XR','Dexedrine','Dexamfetamine','Focalin','Mydayis','Modafinil','Armodafinil'];
  const STIM_DOSE_REF={concerta:72,ritalin:60,methylphenidate:72,focalin:40,dexmethylphenidate:40,vyvanse:70,elvanse:70,lisdexamfetamine:70,adderall:60,'adderall xr':60,amphetamine:60,mydayis:50,dexedrine:40,dexamfetamine:40,dextroamphetamine:40,modafinil:400,armodafinil:250};
  const STIM_FLOOR=200,STIM_CEIL=400,STIM_DEFAULT=300,STIM_TOTAL_CAP=600;
  function stimRef(name){ const n=String(name||'').toLowerCase(); let best=null; for(const k in STIM_DOSE_REF){ if(n.indexOf(k)!==-1&&(!best||k.length>best.length))best=k; } return best?STIM_DOSE_REF[best]:null; }
  function stimWaterMl(stims){ if(!Array.isArray(stims)||!stims.length)return 0; let sum=0; for(const s of stims){ const ref=stimRef(s.name); if(s.mg!=null&&ref){ const frac=Math.max(0,Math.min(1,s.mg/ref)); sum+=STIM_FLOOR+frac*(STIM_CEIL-STIM_FLOOR); } else sum+=STIM_DEFAULT; } return Math.round(Math.min(STIM_TOTAL_CAP,sum)); }
  function computeTarget(s){ const base=(s.weightKg||0)*35; const exercise=(s.activityHrsPerDay||0)*500; const caffeine=Math.max(0,(s.caffeineMgPerDay||0)-300)*1; const stims=stimWaterMl(s.stims); let adjust=0; if(s.sex==='m')adjust+=200; if((s.age||0)>=50)adjust+=100; return {base,exercise,caffeine,stims,adjust,total:base+exercise+caffeine+stims+adjust}; }
  function unitVolMl(s){ if(s.unit==='bottle')return s.bottleMl||500; if(s.unit==='glass')return s.glassMl||250; if(s.unit==='oz')return 30; return 1; }
  function fmtMl(ml){ if(ml>=1000)return (ml/1000).toFixed(1)+' L'; return Math.round(ml)+' ml'; }

  // logs[dateKey] is MILLILITRES drunk that day — see the v3 note in water.html.
  function seed(){ const logs={}; const samples=[6,5,6,4,6,7,3,6,5,6,2,6,4]; for(let i=0;i<samples.length;i++){ const d=new Date(); d.setDate(d.getDate()-(samples.length-i)); logs[getLocalDateKey(d)]=samples[i]*500; }
    let _p=null; try{ _p=JSON.parse(localStorage.getItem('patron_profile_v1')||'null'); }catch(e){}
    return { version:3, unit:'ml', bottleMl:500, glassMl:250, adds:{}, weightKg:(_p&&_p.weightKg)?_p.weightKg:70, age:(_p&&(_p.age||_p.age===0))?(Number(_p.age)||25):25, sex:(_p&&_p.sex)?String(_p.sex).toLowerCase():'m', weightUnit:(_p&&_p.units)?(_p.units==='imperial'?'lb':'kg'):'kg', activityHrsPerWeek:0, activityHrsPerDay:0, stims:[], caffeineMgPerDay:(_p&&_p.caffeineMgPerDay)?(Number(_p.caffeineMgPerDay)||200):200, logs }; }
  /* v2 → v3: logs[] moved from a tap-count to millilitres. Must stay identical

  function heroHtml(){ const tc=todayMl(),tu=targetMl(); const pctRaw=tu>0?(tc/tu)*100:0,ringPct=Math.min(100,pctRaw),isOver=pctRaw>100,hit=pctRaw>=100;

  function historyHtml(){ const tu=targetMl(); const days=[]; for(let i=13;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push({date:d,key:getLocalDateKey(d)}); }
    const counts=days.map(d=>state.logs[d.key]||0); if(!counts.some(c=>c>0))return '<section class="en-card"><p class="en-eyebrow">Last 14 days</p><p class="en-muted">Log a few days and the chart fills in.</p></section>';

  document.addEventListener('input',e=>{ if(activeTab!=='food')return;
    if(e.target.id==='foodQ'){ query=e.target.value; const r=document.getElementById('foodResults'); if(r)r.innerHTML=resultsInner(); }
    else if(e.target.id==='foodGoal'){ const n=Number(e.target.value); setGoalCal(isFinite(n)&&n>=0?n:0); renderPanel(); } });
  document.addEventListener('click',e=>{ if(activeTab!=='food')return;
    const add=e.target.closest('[data-add]'); if(add){ const f=matches[Number(add.getAttribute('data-add'))]; const gramsEl=document.querySelector('[data-grams="'+add.getAttribute('data-add')+'"]'); const grams=Number(gramsEl&&gramsEl.value); if(!f||!isFinite(grams)||grams<=0){ alert('Enter how many grams.'); return; } const k=grams/100; const log=todaysLog(); log.push({name:f.name,grams,cal:f.cal*k,p:f.p*k,c:f.c*k,f:f.f*k}); setTodaysLog(log); query=''; renderPanel(); return; }
    const del=e.target.closest('[data-del]'); if(del){ const log=todaysLog(); const gone=log[Number(del.getAttribute('data-del'))];
      // Part of a logged drink? Take the water and caffeine with it.
      if(gone&&gone.grp&&window.ComboLog){ ComboLog.remove(gone.grp); store=loadAll(); renderPanel(); return; }
      log.splice(Number(del.getAttribute('data-del')),1); setTodaysLog(log); renderPanel(); } });
  window.addEventListener('storage',e=>{ if(e.key===STORE_KEY){ store=loadAll(); if(activeTab==='food')renderPanel(); } });

  /* ---- for the quick box ---- */
  /* Word-level match: "chicken 200g" has to find "Chicken breast", and
   * "rice" has to find "White rice" — neither is a substring of the other.
   * Score by how many of the food's own words appear, so "sweet potato"
   * (2 words matched) beats plain "Potato" (1). */
  function findFood(text){
    let best=null;
    FOODS.forEach(f=>{
      const words=f.name.toLowerCase().replace(/[()]/g,' ').split(/\s+/).filter(w=>w.length>=3);
      if(!words.length) return;
      let hits=0, chars=0;
      words.forEach(w=>{ if(new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(text)){ hits++; chars+=w.length; } });
      if(!hits) return;
      if(!best || hits>best.hits || (hits===best.hits && chars>best.chars)) best={f:f,hits:hits,chars:chars};
    });
    return best?best.f:null;
  }
  function logFood(f,grams){
    store=loadAll();
    const k=grams/100;
    const entry={name:f.name,grams,cal:f.cal*k,p:f.p*k,c:f.c*k,f:f.f*k};
    const log=todaysLog(); log.push(entry); setTodaysLog(log);
    return entry;
  }
  // A ready-made entry (a drink from the catalogue), already totalled.
  function logEntry(e){
    store=loadAll();
    const log=todaysLog(); log.push(e); setTodaysLog(log);
    return e;
  }
  return { html, after, findFood, logFood, logEntry, foods:FOODS };
})();

function readLS(k){ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):null; }catch(e){ return null; } }

function fmtClock(ms){ const d=new Date(ms); let h=d.getHours(); const m=d.getMinutes(); const ap=h<12?'am':'pm'; h=h%12===0?12:h%12; return h+':'+String(m).padStart(2,'0')+ap; }
function mins(ms){ const m=Math.round(ms/60000); if(m<60)return m+' min'; const h=Math.floor(m/60),mm=m%60; return h+'h'+(mm?' '+mm+'m':''); }
function localDateKey(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function activeDateKey(){ const d=new Date(); if(d.getHours()<6)d.setDate(d.getDate()-1); return localDateKey(d); }

let toastTimer;
function toast(msg){ const t=document.getElementById('enToast'); if(!t)return; t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }

/* =====================================================================
 * MODULE: STIMULANTS  (key: stimulant_standalone_v1)
 * One-compartment caffeine PK — predicts peak / comedown / clearance.
 * ===================================================================== */
const STIM = (function(){
  const LS='stimulant_standalone_v1';
  let state = (function(){ const r=readLS(LS); return { logs:(r&&Array.isArray(r.logs))?r.logs:[], custom:(r&&Array.isArray(r.custom))?r.custom:[] }; })();
  function save(){ try{ localStorage.setItem(LS,JSON.stringify(state)); }catch(e){} if(window.PatronDB&&PatronDB.isCloud())PatronDB.set('stimulant',state); }
  const NOW=()=>Date.now();
  let query='';

  const KA=4.0;
  function halfLifeH(){ let hl=5; const p=profile(); if(p){ if(p.sex==='F')hl*=1.05; if(typeof p.age==='number'){ if(p.age>=60)hl*=1.12; else if(p.age>0&&p.age<18)hl*=1.05; } } return hl; }
  function ke(){ return Math.LN2/halfLifeH(); }
  function tmaxH(){ const ka=KA,k=ke(); return Math.log(ka/k)/(ka-k); }
  function doseAmount(mg,h){ if(h<0)return 0; const ka=KA,k=ke(); if(Math.abs(ka-k)<1e-9)return 0; const a=mg*ka/(ka-k)*(Math.exp(-k*h)-Math.exp(-ka*h)); return Math.max(0,a); }
  function bodyAt(t){ return state.logs.reduce((s,l)=>s+doseAmount(l.mg,(t-l.t)/3600000),0); }
  function dailyLimit(){ const p=profile(); const wt=(p&&p.weightKg)?p.weightKg:75; return Math.max(250,Math.min(400,Math.round(6*wt/10)*10)); }

  const DB=[
    ['Espresso (single)',63,'coffee'],['Double espresso',126,'coffee'],['Brewed coffee (8 oz)',95,'coffee'],
    ['Brewed coffee (12 oz)',140,'coffee'],['Drip coffee (16 oz)',190,'coffee'],['Cold brew (16 oz)',205,'coffee'],
    ['Nitro cold brew (16 oz)',280,'coffee'],['Americano',154,'coffee'],['Latte',126,'coffee'],['Cappuccino',126,'coffee'],
    ['Flat white',130,'coffee'],['Mocha',152,'coffee'],['Instant coffee (8 oz)',62,'coffee'],['Decaf coffee (8 oz)',3,'coffee'],
    ['Black tea',47,'tea'],['Green tea',28,'tea'],['Matcha (1 tsp)',70,'tea'],['White tea',15,'tea'],['Oolong tea',38,'tea'],
    ['Chai latte',50,'tea'],['Bottled iced tea',25,'tea'],['Yerba mate',85,'tea'],
    ['Red Bull (8.4 oz)',80,'energy'],['Red Bull (12 oz)',114,'energy'],['Monster (16 oz)',160,'energy'],
    ['Monster Ultra (16 oz)',140,'energy'],['Bang (16 oz)',300,'energy'],['Celsius (12 oz)',200,'energy'],
    ['Rockstar (16 oz)',160,'energy'],['Reign (16 oz)',300,'energy'],['Prime Energy (12 oz)',200,'energy'],
    ['5-Hour Energy',200,'energy'],['G Fuel (1 scoop)',150,'energy'],
    ['Coca-Cola (12 oz)',34,'soda'],['Diet Coke (12 oz)',46,'soda'],['Pepsi (12 oz)',38,'soda'],
    ['Mountain Dew (12 oz)',54,'soda'],['Dr Pepper (12 oz)',41,'soda'],
    ['Pre-workout (1 scoop)',200,'other'],['Caffeine pill (100 mg)',100,'other'],['Caffeine pill (200 mg)',200,'other'],
    ['Dark chocolate (1 oz)',24,'other'],['Hot chocolate',5,'other'],['Espresso martini',100,'other'],
  ].map(d=>({name:d[0],mg:d[1],cat:d[2]}));

  function logsToday(){ const k=localDateKey(); return state.logs.filter(l=>localDateKey(new Date(l.t))===k); }
  function mgToday(){ return logsToday().reduce((s,l)=>s+l.mg,0); }
  function allDrinks(){ return state.custom.map(c=>({name:c.name,mg:c.mg,cat:'custom'})).concat(DB); }
  function nextBedtime(){ const h=loadHealth(); if(!h||!h.bedtime)return null; const [hh,mm]=String(h.bedtime).split(':').map(Number); if(!isFinite(hh))return null; const d=new Date(); d.setHours(hh,mm||0,0,0); if(d.getTime()<=NOW())d.setDate(d.getDate()+1); return d.getTime(); }
  function timing(){ if(!state.logs.length)return null; const last=state.logs.reduce((a,b)=>a.t>b.t?a:b); const peakMs=last.t+tmaxH()*3600000; const peakTotal=bodyAt(peakMs); let comedown=null,clear=null; for(let m=0;m<=20*60;m+=5){ const t=peakMs+m*60000; const amt=bodyAt(t); if(comedown===null&&amt<=peakTotal*0.5)comedown=t; if(clear===null&&amt<=25){clear=t;break;} } return {last,peakMs,peakTotal,comedown,clear}; }
  function status(){ const now=NOW(),cur=bodyAt(now); const lim=dailyLimit(),today=mgToday(); if(today>lim)return{word:'Over limit',tone:'danger'}; if(cur<10)return{word:'Clear',tone:'muted'}; const soon=bodyAt(now+10*60000); if(soon>cur+1){ const t=timing(); if(t&&now<t.peakMs-3*60000)return{word:'Kicking in',tone:''}; return{word:'Peaking',tone:''}; } if(cur>180)return{word:'Wired',tone:'warn'}; if(cur>60)return{word:'Dialed in',tone:''}; return{word:'Comedown',tone:'warn'}; }

  function logDrink(name,mg){ mg=Math.round(Number(mg)); if(!isFinite(mg)||mg<0)return; state.logs.push({id:'c_'+NOW().toString(36)+Math.random().toString(36).slice(2,5),name:String(name),mg,t:NOW()}); save(); renderPanel(); const t=timing(); if(t){ let msg='Logged · peak '+fmtClock(t.peakMs); if(t.comedown)msg+=' · dip '+fmtClock(t.comedown); toast(msg); } }
  /* A drink logged from the Food & Water quick box also wrote water and
   * calories under a shared group id. Removing it here removes those too —
   * otherwise deleting the Monster left its 500 ml behind for good. */
  function removeLog(id){
    const gone=state.logs.find(l=>l.id===id);
    // Drop the caffeine entry first, then let ComboLog take the water and
    // calories with it — by group id, or by name for anything logged before
    // group ids existed.
    state.logs=state.logs.filter(l=>l.id!==id); save();
    if(gone&&window.ComboLog){
      ComboLog.removeFor(gone.grp, gone.name, localDateKey(new Date(gone.t)));
    }
    renderPanel();
  }
  function addCustom(name,mg){ name=(name||'').trim(); mg=Math.round(Number(mg)); if(!name){toast('Name your drink first');return;} if(!isFinite(mg)||mg<0){toast('Enter the caffeine in mg');return;} if(!state.custom.some(c=>c.name.toLowerCase()===name.toLowerCase()))state.custom.unshift({name,mg}); save(); logDrink(name,mg); }

  function curveSvg(){
    const now=NOW(); const start=now-3600000; const end=now+11*3600000; const W=320,H=110,padY=8;
    const pts=[]; let max=1;
    for(let t=start;t<=end;t+=15*60000){ const a=bodyAt(t); if(a>max)max=a; pts.push([t,a]); }
    const xOf=t=>((t-start)/(end-start))*W, yOf=a=>H-padY-(a/max)*(H-padY*2);
    const line=pts.map((p,i)=>(i?'L':'M')+xOf(p[0]).toFixed(1)+' '+yOf(p[1]).toFixed(1)).join(' ');
    const area=line+' L '+W+' '+(H-padY)+' L 0 '+(H-padY)+' Z';
    const nowX=xOf(now).toFixed(1); const t=timing(); let marks='';
    if(t){ const px=xOf(t.peakMs); if(px>=0&&px<=W)marks+='<line x1="'+px.toFixed(1)+'" y1="0" x2="'+px.toFixed(1)+'" y2="'+H+'" stroke="#6EE7B7" stroke-width="1" stroke-dasharray="2 3" opacity=".6"/>';
      if(t.comedown){ const cx=xOf(t.comedown); if(cx>=0&&cx<=W)marks+='<line x1="'+cx.toFixed(1)+'" y1="0" x2="'+cx.toFixed(1)+'" y2="'+H+'" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 3" opacity=".5"/>'; } }
    return '<div class="en-chartWrap"><svg class="en-chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'
      +'<defs><linearGradient id="enCf" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6EE7B7" stop-opacity=".34"/><stop offset="100%" stop-color="#6EE7B7" stop-opacity="0"/></linearGradient></defs>'
      +marks+'<path d="'+area+'" fill="url(#enCf)"/>'
      +'<path d="'+line+'" fill="none" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 5px rgba(110,231,183,.7))"/>'
      +'<line x1="'+nowX+'" y1="0" x2="'+nowX+'" y2="'+H+'" stroke="#fff" stroke-width="1" opacity=".5"/>'
      +'</svg><div class="en-axis"><span>now</span><span>+4h</span><span>+8h</span><span>+11h</span></div></div>';
  }
  function chip(name,mg){ return '<button class="en-chip" data-stim="log" data-name="'+esc(name)+'" data-mg="'+mg+'">'+esc(name)+' · '+mg+'</button>'; }

  function html(){
    const now=NOW(), cur=Math.round(bodyAt(now)); const st=status(); const t=timing();
    const lim=dailyLimit(), today=Math.round(mgToday()); const pct=Math.min(100,today/lim*100); const bed=nextBedtime();
    let peakStr='—',comeStr='—',clearStr='—',peakSub='',comeSub='',clearSub='';
    if(t){ peakStr=fmtClock(t.peakMs); peakSub=now<t.peakMs?'in '+mins(t.peakMs-now):'reached';
      comeStr=t.comedown?fmtClock(t.comedown):'—'; comeSub=t.comedown&&now<t.comedown?'in '+mins(t.comedown-now):'';
      clearStr=t.clear?fmtClock(t.clear):'—'; clearSub=t.clear?'~back to baseline':''; }
    let notes='';
    if(today>lim) notes+='<div class="en-note danger">⚠ You\'ve had <b>'+today+' mg</b> today — over your <b>'+lim+' mg</b> ceiling. Expect jitters and poor sleep. Ease off.</div>';
    else if(today>lim*0.8) notes+='<div class="en-note warn">You\'re at <b>'+today+' mg</b> of your <b>'+lim+' mg</b> daily limit — one more strong drink pushes you over.</div>';
    if(bed){ const atBed=Math.round(bodyAt(bed)); if(atBed>=50)notes+='<div class="en-note warn">≈<b>'+atBed+' mg</b> still in your system at bedtime ('+fmtClock(bed)+'). Consider switching to decaf now.</div>'; }
    if(!state.logs.length) notes='<div class="en-note">Log your first drink and I\'ll predict exactly when you\'ll <b>peak</b> and <b>crash</b> — personalised to your weight, age and sex.</div>';

      +'<section class="en-card"><div class="en-hero"><div class="en-heroNum">'+cur+'<small>mg in system</small></div>'
      +'<span class="en-chipStat"'+(st.tone?' data-tone="'+st.tone+'"':'')+'><span class="dot"></span>'+st.word+'</span></div>'

      +'<div class="en-insight"><div class="en-insLabel en-amber">📉 Comedown</div><div class="en-insVal en-amber">'+comeStr+'</div><div class="en-insSub">'+comeSub+'</div></div>'
      +'<div class="en-insight"><div class="en-insLabel">🌙 Cleared</div><div class="en-insVal">'+clearStr+'</div><div class="en-insSub">'+clearSub+'</div></div>'
      +'</div>'+curveSvg()+notes+'</section>'
      +'<section class="en-card"><div class="en-barHead"><span class="en-eyebrow" style="margin:0">Today</span>'
      +'<span><span class="en-barNum"'+(today>lim?' style="color:var(--vk-red)"':'')+'>'+today+'</span><span class="en-barTarget"> / '+lim+' mg</span></span></div>'
      +'<div class="en-bar"><div class="en-barFill'+(today>lim?' over':'')+'" style="width:'+pct+'%"></div></div></section>'
      +'<section class="en-card"><p class="en-eyebrow">Log a drink</p>'
      +'<div class="en-chips">'+chip('Coffee',95)+chip('Espresso',63)+chip('Energy drink',160)+chip('Tea',47)+chip('Pre-workout',200)+'</div>'
      +'<div class="en-search">'+searchIcon+'<input class="en-input pad" id="stimSearch" placeholder="Search 40+ caffeinated drinks…" value="'+esc(query)+'" autocomplete="off"></div>'
      +'<ul class="en-list">'+(results.length?results.map(d=>{ let sb=''; try{ sb=SUP.badge(SUP.caffeineScore(d.mg)); }catch(e){} return '<li class="en-itemRow" data-stim="log" data-name="'+esc(d.name)+'" data-mg="'+d.mg+'"><div class="en-itemMain"><div class="en-itemName">'+sb+esc(d.name)+'</div><div class="en-itemMeta">'+esc(d.cat)+'</div></div><div class="en-itemVal">'+d.mg+'<small> mg</small></div></li>'; }).join(''):'<li class="en-muted">No match — add it as a custom drink below.</li>')+'</ul></section>'
      +'<section class="en-card"><p class="en-eyebrow">Add a custom drink</p>'
      +'<form class="en-row2" data-stim="addForm"><input class="en-input" id="stimCName" placeholder="Drink name" autocomplete="off"><input class="en-input mg" id="stimCMg" type="number" inputmode="numeric" min="0" max="1000" placeholder="mg"><button type="submit" class="en-btn">Add</button></form>'
      +'<p class="en-muted" style="margin-top:8px">Not on the list? Enter its caffeine in mg — saved for next time and logged now.</p></section>'
      +(tl.length?'<section class="en-card"><p class="en-eyebrow">Today\'s intake</p><ul class="en-list">'+tl.map(l=>'<li class="en-itemRow" style="cursor:default"><span class="en-itemVal" style="color:var(--vk-mint)">'+fmtClock(l.t)+'</span><span class="en-itemName" style="flex:1">'+esc(l.name)+'</span><span class="en-itemVal">'+l.mg+' mg</span><button class="en-del" data-stim="del" data-id="'+l.id+'" aria-label="Remove">×</button></li>').join('')+'</ul></section>':'');
  }
  function after(){ const si=document.getElementById('stimSearch'); if(si&&query){ si.focus(); si.setSelectionRange(query.length,query.length); } }

  // events
  document.addEventListener('click',e=>{ if(activeTab!=='stim')return; const b=e.target.closest('[data-stim]'); if(!b)return; const a=b.dataset.stim; if(a==='log')logDrink(b.dataset.name,b.dataset.mg); else if(a==='del')removeLog(b.dataset.id); });
  document.addEventListener('submit',e=>{ if(activeTab!=='stim')return; const f=e.target.closest('[data-stim="addForm"]'); if(!f)return; e.preventDefault(); addCustom(document.getElementById('stimCName').value,document.getElementById('stimCMg').value); });
  document.addEventListener('input',e=>{ if(activeTab!=='stim')return; if(e.target.id==='stimSearch'){ query=e.target.value; renderPanel(); } });

  function hydrate(){ if(!window.PatronDB||!PatronDB.isCloud())return; PatronDB.get('stimulant').then(cs=>{ if(cs&&Array.isArray(cs.logs)){ state={logs:cs.logs,custom:Array.isArray(cs.custom)?cs.custom:[]}; try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){} if(activeTab==='stim')renderPanel(); } else { PatronDB.set('stimulant',state); } }).catch(()=>{}); }
  function hasLogs(){ return state.logs.length>0; }
  function mgTodayPub(){ return mgToday(); }
  /* The quick box writes this key directly, so the module has to be told to
   * re-read it — otherwise the tab keeps rendering the state it loaded at boot
   * and a drink logged from the box has no delete button. */
  function reload(){ const r=readLS(LS); state.logs=(r&&Array.isArray(r.logs))?r.logs:[]; state.custom=(r&&Array.isArray(r.custom))?r.custom:[]; }
  return { html, after, hydrate, hasLogs, mgTodayPub, reload };
})();

  function subNorm(tau,tPeak,dur){ if(tau<0)return 0; tPeak=tPeak||1; dur=dur||4; if(tau<=tPeak)return 0.5-0.5*Math.cos(Math.PI*tau/tPeak); const decay=Math.max(0.3,(dur-tPeak)/2.2); return Math.exp(-(tau-tPeak)/decay); }

  /* =====================================================================
   * RESEARCH-GROUNDED SCORING ENGINE  (replaces the hand-set baseScore)
   * ---------------------------------------------------------------------
   * Every number below is an effect size (Cohen's d / SMD) or a dose taken
   * from meta-analyses — see SOURCES at the bottom of this block. The score
   * is "personal benefit /10": how much THIS substance, at the dose given,
   * is expected to help THIS user right now, given body size, age, sex,
   * training status, goals, and — weighted by its own measured effect size —
   * sleep. No taste-based weighting: the relative importance of each lever
   * is the published statistic, nothing else.
   *
   *   d (per domain)  → how big the effect is, in standard deviations
   *   ev             → evidence grade A/B/C/D → confidence the d is real
   *   defDep         → benefit is gated on being deficient (vit D, iron…)
   *   dose {thr,opt,ceil[,hard]}  in the item's display unit; bw = mg/kg
   *   sleepD         → effect on SLEEP itself (+improves / −disrupts), in d
   *   mods           → responder multipliers on d, keyed to profile signals
   * ===================================================================== */

  // Effect size of one night's good-vs-bad sleep on next-day cognitive +
  // physical performance. Lim & Dinges 2010 / Lowe 2017: lapses g≈0.78,
  // working memory d≈0.6–0.9, executive d≈0.5–0.8 → anchor ≈ 1.0.
  // This is the "leverage" that makes sleep the dominant lever: it is simply
  // larger than any supplement's own d, so fixing sleep (or not wrecking it)
  // outweighs a pill's direct effect whenever sleep is at stake.
  const SLEEP_PERF_D = 1.0;

  // Map a (possibly user-weighted) effect size d to a 0–10 benefit score.
  // 10·(1−e^(−1.4d)): d 0.2→2.4, 0.3→3.4, 0.5→5.0, 0.8→6.7, 1.0→7.5, 1.5→8.8.
  // Deliberately honest — most isolated supplements land 2–6; only large,
  // well-evidenced, well-matched effects (deficiency correction, sleep repair
  // in a poor sleeper, caffeine for endurance) reach the top of the scale.
  function scoreFromD(d){ if(d<=0)return 0; return 10*(1-Math.exp(-1.4*d)); }
  const EV_CONF = { A:1.0, B:0.85, C:0.68, D:0.45 };

  // numbers reflect heterogeneity flagged by the source reviews.

  };

  // How much the user NEEDS each performance domain right now (0 ≈ irrelevant,
  // 1 ≈ a top priority). Driven only by their goal + training + recovery state.
  // A domain the user doesn't need contributes ~0 to a substance's score, so the
  // same pill scores differently for a bulker vs. someone chasing sleep.
  function domainNeeds(u){
    // Low baselines so a substance is judged mainly on the domains the user
    // actually prioritises (a goal/state "bumps" the relevant domain up). This
    // keeps the score honest about effect size without diluting a focused
    // substance across outcomes the user doesn't care about.
    const n = { strength:.08,power:.08,hypertrophy:.08,endurance:.08,recovery:.1,focus:.1,memory:.08,mood:.1,stress:.1,sleep:.12,immune:.1,cardio:.1,metabolic:.08,longevity:.1,hormonal:.06,joint:.08,energy:.1,bone:.06 };
    const bump=(k,v)=>{ if(v>n[k])n[k]=v; };
    if(u.goal==='bulk'){ bump('hypertrophy',1);bump('strength',.7);bump('recovery',.4); }
    else if(u.goal==='cut'){ bump('metabolic',.8);bump('endurance',.5);bump('energy',.4);bump('recovery',.3); }
    else if(u.goal==='recomp'){ bump('strength',.7);bump('hypertrophy',.7);bump('recovery',.4); }
    else if(u.goal==='general_health'){ bump('longevity',.7);bump('cardio',.7);bump('immune',.6);bump('mood',.5);bump('metabolic',.4); }
    if(u.gymLevel==='intermediate'||u.gymLevel==='advanced'){ bump('strength',.6);bump('power',.5);bump('recovery',.7);bump('endurance',.5);bump('hypertrophy',.5);bump('joint',.4); }
    if(u.age!=null&&u.age>=50){ bump('longevity',.6);bump('cardio',.5);bump('joint',.5);bump('memory',.5);bump('bone',.5);bump('hormonal',.3);bump('immune',.4); }
    else if(u.age!=null&&u.age>=40){ bump('longevity',.45);bump('cardio',.4);bump('joint',.4);bump('memory',.4); }
    // Sleep / recovery state — these set the dominant levers when they fire.
    const sd=sleepDeficit(u);
    if(sd>0){ bump('sleep',Math.max(n.sleep,sd));bump('stress',.4+.4*sd);bump('recovery',.4+.4*sd);bump('mood',.4*sd); }
    if(u.recovery!=null&&u.recovery<50){ const r=(50-u.recovery)/50; bump('recovery',.6+.4*r);bump('sleep',.5+.4*r);bump('stress',.4+.3*r); }
    if(u.caffeineMgPerDay>200){ bump('sleep',Math.max(n.sleep,.55));bump('stress',.35); }
    if(u.hasStims||u.hasNicotine){ bump('sleep',Math.max(n.sleep,.6));bump('recovery',.4); }
    return n;
  }

  // 0 (slept great) → ~1 (badly under-slept). Uses sleep performance / hours /
  // subjective band / recovery as available. This is the gate on every sleep term.
  function sleepDeficit(u){
    if(typeof u.sleepPerf==='number') return clamp((85-u.sleepPerf)/45,0,1);     // 85+ = no deficit, 40 = full
    if(typeof u.sleepHours==='number'&&u.sleepTargetHours) return clamp((u.sleepTargetHours-u.sleepHours)/3,0,1);
    if(u.sleep==='poor')return .85; if(u.sleep==='fair')return .45; if(u.sleep==='good')return .05;
    if(u.recovery!=null)return clamp((60-u.recovery)/50,0,1);
    return .35; // unknown → assume a typical mild deficit
  }

  // Per-mg dose-response: 0 below threshold, rises to 1.0 at the optimal dose,
  // holds across the effective range, then declines past the ceiling (and turns
  // counter-productive past a `hard` cap — e.g. caffeine jitter, melatonin
  // grogginess). `bw` doses are taken as mg/kg and scaled to bodyweight.
  // When dose.bw is set, thr/opt/ceil/hard are PER-KG and scale to bodyweight
  // (caffeine 3–6 mg/kg, whey ~0.4 g/kg, omega-3 ~0.02 g/kg, etc).
  function effDose(r,weightKg){ const D=r.dose||{}; const w=weightKg||75; const s=D.bw?w:1;
    return { thr:D.thr!=null?D.thr*s:null, opt:D.opt!=null?D.opt*s:null, ceil:D.ceil!=null?D.ceil*s:null, hard:D.hard!=null?D.hard*s:null }; }
  function doseFactor(r,dose,weightKg){
    const e=effDose(r,weightKg); const thr=e.thr,opt=e.opt,ceil=e.ceil,hard=e.hard;
    if(opt==null)return 1;
    if(dose==null||!isFinite(dose))dose=opt;            // assume optimal if unknown
    if(dose<=0)return 0;
    let f;
    if(thr!=null&&dose<thr) f=0.45*(dose/Math.max(thr,1e-6));   // sub-threshold: partial
    else if(dose<opt) f=0.45+0.55*((dose-(thr||0))/Math.max(opt-(thr||0),1e-6));
    else if(ceil==null||dose<=ceil) f=1;
    else { const over=(dose-ceil)/Math.max(ceil,1e-6); f=1-Math.min(0.6,over*0.8); }
    if(hard&&dose>hard){ const o=(dose-hard)/Math.max(hard,1e-6); f=Math.min(f,0.7-Math.min(0.9,o*0.7)); } // counter-productive
    return clamp(f,0,1.0);
  }

  // Parse the leading number from a dose string ("2,000-5,000 IU" → 3500,
  // "5 g" → 5) in the SAME unit the research thresholds use for that item.
  function parseDose(str){ if(!str)return null; const m=String(str).replace(/,/g,'').match(/(\d+(?:\.\d+)?)(?:\s*[-–]\s*(\d+(?:\.\d+)?))?/); if(!m)return null; const a=parseFloat(m[1]); const b=m[2]!=null?parseFloat(m[2]):null; return b!=null?(a+b)/2:a; }

  // Likelihood (0..1) that a deficiency-dependent nutrient will actually help —
  // we have no labs, so we infer from profile risk factors. Replete-by-default
  // users get a discounted score for these (honest: most aren't deficient).
  function deficiencyLikelihood(id,u){
    let p=0.45; // population base rate of meaningful low status / room to benefit
    if(id==='iron'){ p=(u.sex==='F')?0.55:0.12; }
    else if(id==='vit-d3'){ p=0.6; if(u.age>=50)p+=0.15; }
    else if(id==='b12'){ p=0.35; if(u.age>=50)p+=0.2; }
    else if(id==='zinc'||id==='vit-k2'){ p=0.4; if(u.age>=50)p+=0.1; }
    else if(id==='mag-glycinate'){ p=0.5; if(u.caffeineMgPerDay>200||u.hasStims)p+=0.15; }
    else if(id==='berberine'){ p=0.3; if(u.goal==='cut')p+=0.2; if(u.age>=50)p+=0.15; } // metabolic room-to-benefit
    return clamp(p,0.05,0.95);
  }

  // THE SCORE. Returns { score (0–10, decimals), dUser, dose, doseF, factors[] }.
  function evaluate(id,u,doseOverride){
    const r=RX[id]; if(!r) return { score:0, dUser:0, factors:[] };
    const sigs=u._sigs||extractSignals(u);
    const needs=u._needs||domainNeeds(u);
    const sd=u._sd!=null?u._sd:sleepDeficit(u);
    const defDose=effDose(r,u.weightKg).opt;            // optimal dose in absolute units
    const dose=(doseOverride!=null)?doseOverride:defDose;
    const doseF=doseFactor(r,dose,u.weightKg);

    // 1) user-weighted effect size: judge the substance on ITS domains,
    //    prioritising the ones the user needs. The sleep domain's need carries
    //    the big SLEEP_PERF_D leverage, so sleep work floats up exactly as far
    //    as the statistics say it should.
    let num=0,den=0; const hits=[];
    for(const dom in r.d){ const dval=r.d[dom];
      let w=(needs[dom]||0.15);
      if(dom==='sleep') w*=SLEEP_PERF_D;            // fixing sleep pays off at sleep's own (large) effect size
      num+=dval*w; den+=w;
      if(needs[dom]>=0.4 && dval>=0.15) hits.push(dom);
    }
    let dUser=den>0?num/den:0;

    // 2) confidence the effect is real
    dUser*=EV_CONF[r.ev]||0.6;

    // 3) dose-response (per mg)
    dUser*=doseF;

    // 4) responder multipliers (age/sex/training/use) — only those that fire
    const fired=[];
    if(r.mods){ for(const g of sigs){ if(r.mods[g]!=null){ dUser*=r.mods[g]; if(r.mods[g]>1)fired.push(g); } } }

    // 5) deficiency gating — replete users get little from corrective nutrients
    if(r.defDep){ dUser*=deficiencyLikelihood(id,u); }

    // 6) SLEEP as the top layer, weighted by its own measured effect size:
    //    a) a stimulant's sleep COST (its sleepD, ×SLEEP_PERF_D) is subtracted,
    //       scaled by how poor sleep already is and by stimulant load;
    //    b) when the user is sleep-deprived, non-sleep benefits are compressed,
    //       because nothing performs on no sleep (again, sleep's own d).
    if(r.stim){
      // Wake-promoters give MORE acute benefit the more sleep-deprived you are
      // (caffeine/modafinil rescue tired cognition) — but that is separate from
      // the sleep they cost tonight, handled next.
      dUser*=(1+0.35*sd);
    }
    if(r.sleepD!=null && r.sleepD<0){
      // Penalty only grows once intake is meaningful (<~100 mg ≈ no measured
      // sleep cost; 400 mg ≈ full effect — Drake 2013), and scales with how
      // poor sleep already is. Timing is unknown, so this is the daily average.
      const load=clamp((u.caffeineMgPerDay-100)/300,0,1);

/* =====================================================================
 * QUICK BOX — type one line, it works out where it belongs.

 * Order matters: a named food wins over a volume, so "200ml milk" is food
 * rather than water. Only then does a bare volume mean water. Anything else
 * is treated as a supplement, which is the open-ended case.

 * Supplements live in supplements_standalone_v1, owned by another page, so
 * this writes that key directly and marks the item taken for today —
 * matching the shape that page and the dashboard tile both already read.

const QUICK=(function(){

  const SUP_KEY='supplements_standalone_v1';

  function parse(raw){
    const s=String(raw||'').trim(); if(!s) return null;
    const low=s.toLowerCase();

    // 1. a food we know, with optional grams (defaults to 100g, the table's basis)
    const food=FOOD.findFood(low);
    if(food){
      const g=low.match(/(\d+(?:[.,]\d+)?)\s*g\b/) || low.match(/(\d+(?:[.,]\d+)?)/);
      const grams=g?Math.max(1,parseFloat(g[1].replace(',','.'))):100;

      if(ml>0) return { kind:'water', ml:Math.round(ml) };
    }

    // 3. otherwise a supplement, with an optional dose we keep as a note
    const dose=low.match(/(\d+(?:[.,]\d+)?)\s*(mg|mcg|µg|g|iu)\b/);
    const name=s.replace(/(\d+(?:[.,]\d+)?)\s*(mg|mcg|µg|g|iu)\b/ig,'').replace(/\s+/g,' ').trim();

       * never drawn — present in the tally, invisible in the list. Random
       * suffix on the id too: two added in the same millisecond would
       * otherwise share one and clobber each other. */
      const hour=new Date().getHours();

             name, icon:'💊', dose:dose||'', window:win, note:'', sourceId:null };

    }
    const k=getLocalDateKey();
    if(!st.taken[k]) st.taken[k]={};
    st.taken[k][item.id]=true;
    try{
      if(window.PatronDB&&PatronDB.write) PatronDB.write(SUP_KEY, JSON.stringify(st));
      else localStorage.setItem(SUP_KEY, JSON.stringify(st));
    }catch(e){}
    return { added };
  }

  function logCaffeine(name,mg,grp){
    if(!(mg>0)) return;
    let st={};
    try{ st=JSON.parse(localStorage.getItem(STIM_KEY)||'{}')||{}; }catch(e){ st={}; }
    if(!Array.isArray(st.logs)) st.logs=[];
    if(!Array.isArray(st.custom)) st.custom=[];
    st.logs.push({ id:'c_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), name:String(name), mg:Math.round(mg), t:Date.now(), grp:grp||null });
    try{
      if(window.PatronDB&&PatronDB.write) PatronDB.write(STIM_KEY, JSON.stringify(st));
      else localStorage.setItem(STIM_KEY, JSON.stringify(st));
    }catch(e){}
  }

  /* One pick, every store it touches — tied together by a group id so that
   * deleting it from any one of those places removes the rest too. */
  function logDrink(d){
    const parts=[];
    const grp=(window.ComboLog?ComboLog.newId():null);
    if(d.ml>0){ WATER.logMl(d.ml); parts.push(WATER.fmt(d.ml)); }
    if(d.cal>0||d.c>0||d.p>0||d.f>0){
      FOOD.logEntry({ name:d.name, grams:d.ml, cal:d.cal, p:d.p||0, c:d.c||0, f:d.f||0, grp:grp });
      parts.push(round(d.cal)+' kcal');
    }
    if(d.mg>0){ logCaffeine(d.name, d.mg, grp); parts.push(d.mg+' mg caffeine'); }
    if(grp&&window.ComboLog) ComboLog.register(grp,{ name:d.name, dateKey:getLocalDateKey(), ml:d.ml||0, cal:d.cal||0, mg:d.mg||0 });
    refreshModules();
    renderPanel();
    return parts;
  }

  function say(cls,where,msg){
    const fb=document.getElementById('qbFeedback');
    if(fb) fb.innerHTML='<span class="'+cls+'"><span class="qbWhere">'+where+'</span>'+esc(msg)+'</span>';
  }

  /* Modules cache their own state, so after writing their keys behind them
   * they have to be told to re-read before the tab is drawn again. */
  function refreshModules(){
    try{ if(typeof STIM!=='undefined'&&STIM.reload) STIM.reload(); }catch(e){}
    try{ if(typeof SUPMED!=='undefined'&&SUPMED.reloadState) SUPMED.reloadState(); }catch(e){}
  }

  /* ---- live suggestions ---- */
  let sugg=[];
  // Match on the name only — "chicken 250g" has to still find Chicken breast,
  // so the quantity and its unit come out of the query first.
  function nameOf(raw){
    return String(raw||'').toLowerCase()
      .replace(/\d+(?:[.,]\d+)?\s*(ml|cl|dl|l|oz|kg|g|mg|mcg|µg|iu)?\b/g,' ')
      .replace(/\s+/g,' ').trim();
  }
  function buildSuggestions(raw){
    const q=nameOf(raw);
    if(q.length<2) return [];
    const out=[];
    DRINKS.forEach(d=>{ if(d.name.toLowerCase().includes(q)) out.push({type:'drink',d:d}); });
    FOOD.foods.forEach(f=>{ const n=f.name.toLowerCase();
      if(n.includes(q) || q.split(' ').some(w=>w.length>=3&&n.includes(w))) out.push({type:'food',f:f}); });
    return out.slice(0,7);
  }
  function suggestionsHtml(list,raw){
    if(!list.length) return '';
    const rows=list.map((s,i)=>{
      if(s.type==='drink'){
        const d=s.d;
        const bits=[]; if(d.ml)bits.push(WATER.fmt(d.ml)); if(d.cal)bits.push(round(d.cal)+' kcal'); if(d.mg)bits.push(d.mg+' mg');
        return '<button type="button" class="qbSug" data-sug="'+i+'"><span class="qbSugName">'+esc(d.name)+'</span>'
          +'<span class="qbSugMeta">'+esc(bits.join(' · '))+'</span></button>';
      }
      const f=s.f;
      return '<button type="button" class="qbSug" data-sug="'+i+'"><span class="qbSugName">'+esc(f.name)+'</span>'
        +'<span class="qbSugMeta">'+f.cal+' kcal / 100g</span></button>';
    }).join('');
    return '<div class="qbSugs">'+rows+'</div>';
  }
  function renderSuggestions(raw){
    sugg=buildSuggestions(raw);
    const box=document.getElementById('qbSuggest');
    if(box) box.innerHTML=suggestionsHtml(sugg,raw);
  }
  function clearSuggestions(){ sugg=[]; const box=document.getElementById('qbSuggest'); if(box) box.innerHTML=''; }

  function pick(i){
    const s=sugg[i]; if(!s) return;
    const el=document.getElementById('qbInput');
    if(s.type==='drink'){
      const parts=logDrink(s.d);
      say('qbOk','logged', s.d.name+' → '+parts.join(' · '));
    } else {
      // A food from the table still needs a portion; 100g is the table's basis.
      const typed=String(el.value||'').toLowerCase().match(/(\d+(?:[.,]\d+)?)\s*g\b/);
      const grams=typed?Math.max(1,parseFloat(typed[1].replace(',','.'))):100;
      const e=FOOD.logFood(s.f,grams);
      say('qbOk','food', e.name+' '+grams+'g · '+round(e.cal)+' kcal');
      renderPanel();
    }
    el.value=''; clearSuggestions(); el.focus();
  }

  function submit(raw){
    // An exact catalogue name typed in full logs the whole drink.
    const exact=DRINKS.find(d=>d.name.toLowerCase()===String(raw||'').trim().toLowerCase());
    if(exact){ const parts=logDrink(exact); say('qbOk','logged', exact.name+' → '+parts.join(' · ')); return true; }

    const p=parse(raw);
    if(!p){ say('qbMiss','?','Didn’t catch that. Try “monster”, “500ml”, “chicken 200g” or “creatine 5g”.'); return false; }

    if(p.kind==='water'){ WATER.logMl(p.ml); say('qbOk','water','+ '+WATER.fmt(p.ml)); renderPanel(); return true; }
    if(p.kind==='food'){ const e=FOOD.logFood(p.food,p.grams); say('qbOk','food','+ '+e.name+' '+p.grams+'g · '+round(e.cal)+' kcal'); renderPanel(); return true; }
    const r=logSupplement(p.name,p.dose);
    refreshModules(); renderPanel();
    say('qbOk','supplement','✓ '+p.name+(p.dose?(' '+p.dose):'')+(r.added?' — added to your stack':' — marked taken'));
    return true;
  }

  const form=document.getElementById('quickBox');
  if(form) form.addEventListener('submit',e=>{
    e.preventDefault();
    const el=document.getElementById('qbInput');
    // Enter takes the top suggestion when there is one — that is what the list is for.
    if(sugg.length){ pick(0); return; }
    if(submit(el.value)){ el.value=''; clearSuggestions(); }
    el.focus();
  });
  const input=document.getElementById('qbInput');
  if(input) input.addEventListener('input',()=>renderSuggestions(input.value));
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-sug]');
    if(b){ e.preventDefault(); pick(Number(b.getAttribute('data-sug'))); return; }
    if(!e.target.closest('#quickBox')&&!e.target.closest('#qbSuggest')) clearSuggestions();
  });
  return { parse, submit, drinks:DRINKS };
})();

/* drifting mint particles (Rowan4 backdrop) */
(function(){ const root=document.getElementById('fwParticles'); if(!root)return; const N=window.innerWidth<640?14:24; for(let i=0;i<N;i++){ const s=document.createElement('span'); s.style.left=Math.random()*100+'%'; s.style.top=(60+Math.random()*40)+'%'; const size=1.2+Math.random()*1.2; s.style.width=s.style.height=size+'px'; const dur=22+Math.random()*28; s.style.animationDuration=dur+'s'; s.style.animationDelay=(-Math.random()*dur)+'s'; s.style.setProperty('--dx',(Math.random()*30-15)+'px'); s.style.setProperty('--dy',-(60+Math.random()*50)+'vh'); root.appendChild(s); } })();

setTab('water');
WATER.hydrate();
})();
</script>
