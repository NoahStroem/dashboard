<style>
/* ============================================================
 * Calendar — "Coming up" + Reminders.
 *
 * Base tokens below match _template.html; skin.css (linked last, as on
 * every other suite page) overrides them to the Vitality look the hub
 * actually renders as. Everything here is token-driven, so it follows
 * whichever skin is active rather than hard-coding a palette.
 * ============================================================ */
:root{
  color-scheme: dark;
  --bg:#0F0F23; --bg-elevated:#1A1A3A;
  --surface:rgba(139,92,246,0.06); --surface-2:rgba(139,92,246,0.11);
  --fg:#F8FAFC; --muted:rgba(226,232,255,0.52); --muted-strong:rgba(226,232,255,0.80);
  --border:rgba(124,58,237,0.22); --border-strong:rgba(167,139,250,0.45);
  --brand:#8B5CF6; --brand-2:#22D3EE; --brand-ink:#0B0420;
  --brand-soft:rgba(139,92,246,0.16); --brand-line:rgba(139,92,246,0.40); --brand-glow:rgba(139,92,246,0.65);
  --pos:#22D3EE; --neg:#F472B6; --warn:#FBBF24;
  --neg-soft:rgba(244,114,182,0.12); --neg-line:rgba(244,114,182,0.30);
  --track:rgba(255,255,255,0.06);
  --card-shadow:0 1px 0 rgba(167,139,250,0.08) inset, 0 22px 50px -28px rgba(0,0,0,0.95);
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;--space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-16:4rem;
  --radius-sm:8px; --radius-md:11px; --radius-lg:18px; --radius-pill:999px;
  --text-xs:.75rem;--text-sm:.875rem;--text-base:1rem;--text-lg:1.125rem;--text-xl:1.375rem;--text-3xl:2.5rem;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-premium:cubic-bezier(.16,1,.3,1); --duration:200ms;
  --font-display:'Orbitron'; --font-ui:'Exo 2'; --font-mono:'JetBrains Mono';
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{ background:var(--bg); color:var(--fg); font-family:var(--font-ui),-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; -webkit-tap-highlight-color:transparent; }
.page{ position:relative; min-height:100dvh; padding:var(--space-8) var(--space-5) var(--space-16); isolation:isolate; }
.page::before{ content:''; position:absolute; inset:0; pointer-events:none; z-index:-1;
  background: radial-gradient(58% 42% at 82% 6%, rgba(139,92,246,0.22), transparent 70%), radial-gradient(48% 38% at 12% 92%, rgba(34,211,238,0.12), transparent 72%); }
.shell{ max-width:1080px; margin:0 auto; }

/* Header — same shape as every other page in the suite */
.header{ display:flex; align-items:flex-end; justify-content:space-between; gap:var(--space-4); margin-bottom:var(--space-8); flex-wrap:wrap; }
.title{ font-family:var(--font-display); font-weight:800; font-size:var(--text-3xl); line-height:1; letter-spacing:.03em; text-transform:uppercase; margin:0;
  background:linear-gradient(120deg,#fff 35%,var(--brand-2) 75%,var(--brand)); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 20px rgba(34,211,238,.4)); }
.subtitle{ font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.18em; color:var(--muted); margin:6px 0 0; }
.headerControls{ display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap; }
.backLink{ display:inline-flex; align-items:center; gap:6px; padding:7px 14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-pill); color:var(--muted-strong); font-size:var(--text-xs); font-weight:600; text-decoration:none; transition:border-color var(--duration) var(--ease-premium), background var(--duration) var(--ease-premium), color var(--duration) var(--ease-premium); }
.backLink:hover{ border-color:var(--brand-line); background:var(--brand-soft); color:var(--fg); }

/* Buttons — the suite's three variants */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2); min-height:44px; padding:.6rem var(--space-4); border-radius:var(--radius-md); font-family:var(--font-ui); font-size:var(--text-sm); font-weight:600; cursor:pointer; border:1px solid transparent; background:transparent; color:var(--fg); text-decoration:none; white-space:nowrap; transition:filter var(--duration) var(--ease), border-color var(--duration) var(--ease), background var(--duration) var(--ease), box-shadow var(--duration) var(--ease); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-primary{ background:var(--brand); color:var(--brand-ink); font-weight:700; }
.btn-primary:hover:not(:disabled){ filter:brightness(1.08); box-shadow:0 0 26px var(--brand-glow); }
.btn-ghost{ border:1px solid var(--border); color:var(--fg); }
.btn-ghost:hover{ border-color:var(--border-strong); background:var(--surface); }
.btn-sm{ min-height:36px; padding:.4rem var(--space-3); font-size:var(--text-xs); }
/* Focus rings: keyboard only, never swallowed. */
.btn:focus-visible, .backLink:focus-visible{ outline:2px solid var(--brand-2); outline-offset:2px; }

/* ---- Layout: the page is one column of panels ---- */
.stack{ display:flex; flex-direction:column; gap:var(--space-5); }
.calCard{ display:flex; flex-direction:column; gap:var(--space-4); padding:var(--space-5); border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--surface); box-shadow:var(--card-shadow); }
.calCardHead{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); flex-wrap:wrap; }
.calEyebrow{ font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:var(--brand); margin:0; }
.calCount{ font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:4px 10px; border-radius:var(--radius-pill); background:var(--surface); border:1px solid var(--border); color:var(--muted-strong); }

/* ---- The Coming up list ---- */
.calList{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:var(--space-5); }
.calGroup{ display:flex; flex-direction:column; gap:var(--space-2); }
.calGroupLabel{ font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin:0; }
.calGroup[data-group="overdue"] .calGroupLabel{ color:var(--neg); }
.calRows{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }

.calRow{ display:grid; grid-template-columns:66px minmax(0,1fr) auto; align-items:baseline; gap:var(--space-3);
  padding:var(--space-3) 0; border-bottom:1px solid var(--border); }
.calRow:last-child{ border-bottom:0; }
.calTime{ font-family:var(--font-mono); font-size:12px; font-variant-numeric:tabular-nums; color:var(--muted-strong); white-space:nowrap; }
.calTime[data-allday]{ font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
.calMain{ display:flex; flex-direction:column; gap:3px; min-width:0; }
.calTitle{ font-size:var(--text-sm); font-weight:600; line-height:1.35; overflow-wrap:anywhere; }
.calMeta{ display:flex; align-items:center; gap:var(--space-2); flex-wrap:wrap; }
.calRel{ font-family:var(--font-mono); font-size:11px; color:var(--muted); white-space:nowrap; text-align:right; }

/* Category tag — colour comes from the model, via a custom property. */
.calTag{ display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted-strong); }
.calTagDot{ width:7px; height:7px; border-radius:50%; background:var(--tag,var(--brand)); box-shadow:0 0 8px var(--tag,var(--brand)); flex-shrink:0; }
.calNote{ font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
/* Mirrored-from-Google marker. Quiet by design — it should read as provenance,
 * not as a warning; these events are perfectly fine, just not editable here. */
.calSrc{ display:inline-flex; align-items:center; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding:2px 7px; border:1px solid var(--border); border-radius:var(--radius-pill); white-space:nowrap; }
.calRow[data-source="google"] .calTitle{ color:var(--muted-strong); }

/* Overdue: a left rule + a tinted time, rather than colouring the whole row red. */
.calRow[data-overdue]{ background:var(--neg-soft); border-left:2px solid var(--neg); margin-left:calc(-1 * var(--space-3)); padding-left:var(--space-3); border-radius:var(--radius-sm); }
.calRow[data-overdue] .calTime, .calRow[data-overdue] .calRel{ color:var(--neg); }

/* ---- Empty state ---- */
.calEmpty{ display:flex; flex-direction:column; gap:var(--space-3); align-items:flex-start; padding:var(--space-6) 0 var(--space-4); }
.calEmptyTitle{ font-family:var(--font-display); font-weight:600; font-size:var(--text-xl); letter-spacing:-.02em; margin:0; }
.calEmptyBody{ font-size:13px; color:var(--muted-strong); line-height:1.55; max-width:46ch; margin:0; }
.calEmptyActions{ display:flex; gap:var(--space-2); flex-wrap:wrap; margin-top:var(--space-2); }

/* ---- Google connection panel ---- */
.gcHead{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); flex-wrap:wrap; }
.gcStatus{ display:inline-flex; align-items:center; gap:7px; font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:4px 10px; border-radius:var(--radius-pill); background:var(--surface); border:1px solid var(--border); color:var(--muted-strong); }
.gcDot{ width:7px; height:7px; border-radius:50%; background:var(--muted); flex-shrink:0; }
.gcStatus[data-state="connected"]{ border-color:var(--brand-line); color:var(--fg); }
.gcStatus[data-state="connected"] .gcDot{ background:var(--brand); box-shadow:0 0 8px var(--brand); }
.gcStatus[data-state="error"]{ border-color:var(--neg-line); color:var(--neg); }
.gcStatus[data-state="error"] .gcDot{ background:var(--neg); box-shadow:0 0 8px var(--neg); }
.gcStatus[data-state="connecting"] .gcDot{ background:var(--warn); box-shadow:0 0 8px var(--warn); animation:gcPulse 1.1s var(--ease) infinite; }
@keyframes gcPulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
.gcBody{ font-size:13px; color:var(--muted-strong); line-height:1.55; max-width:58ch; margin:0; }
.gcErr{ font-size:12px; line-height:1.5; color:var(--neg); background:var(--neg-soft); border:1px solid var(--neg-line); border-radius:var(--radius-md); padding:var(--space-3); margin:0; }
.gcMeta{ font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
.gcActions{ display:flex; align-items:center; gap:var(--space-2); flex-wrap:wrap; }
.gcField{ display:flex; flex-direction:column; gap:6px; }
.gcLabel{ font-family:var(--font-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.gcInput{ width:100%; min-height:44px; padding:.55rem var(--space-3); border-radius:var(--radius-md); border:1px solid var(--border); background:var(--bg-elevated); color:var(--fg); font-family:var(--font-mono); font-size:12px; }
.gcInput:focus-visible{ outline:2px solid var(--brand-2); outline-offset:1px; border-color:var(--brand-line); }
.gcHint{ font-size:11px; line-height:1.5; color:var(--muted); margin:0; }
/* Calendar toggles — native checkboxes, so tab/space work without help. */
.gcCals{ border:0; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
.gcCals legend{ padding:0; margin-bottom:var(--space-2); }
.gcCal{ display:flex; align-items:center; gap:var(--space-3); min-height:40px; padding:6px 8px; border-radius:var(--radius-md); cursor:pointer; transition:background var(--duration) var(--ease); }
.gcCal:hover{ background:var(--surface); }
.gcCal input{ width:16px; height:16px; accent-color:var(--brand); flex-shrink:0; cursor:pointer; }
.gcCal input:focus-visible{ outline:2px solid var(--brand-2); outline-offset:2px; }
.gcCalDot{ width:9px; height:9px; border-radius:3px; background:var(--cal,var(--brand)); flex-shrink:0; }
.gcCalName{ font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gcCalTag{ font-family:var(--font-mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); border:1px solid var(--border); border-radius:var(--radius-pill); padding:2px 7px; }

/* ---- Footer strip ---- */
.calFoot{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); flex-wrap:wrap; }
.calFootNote{ font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }

/* ---- Mobile: the time moves onto its own line above the title ---- */
@media (max-width:560px){
  .page{ padding:var(--space-6) var(--space-4) var(--space-16); }
  .calRow{ grid-template-columns:minmax(0,1fr) auto; }
  .calTime{ grid-column:1 / -1; order:-1; font-size:11px; }
  .calRel{ font-size:10px; }
}
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
</style>

<body>
<main class="page">
  <div class="shell">

    <header class="header">
      <div>
        <h1 class="title">Calendar</h1>
        <p class="subtitle">what's coming up</p>
      </div>
      <div class="headerControls">
        <a class="backLink" href="index.html">← Liam</a>
      </div>
    </header>

    <div class="stack" id="app"></div>

  </div>
</main>

<script>
(function(){
  'use strict';
  var M = window.CalendarModel, Store = window.CalendarStore;

  /* Titles are user input and go in via innerHTML, so everything that reaches
   * the DOM is escaped here. */
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  /* ---- One row of the Coming up list ---- */
  function rowHtml(r, now){
    var overdue = M.isOverdue(r, now);
    var cat = M.category(r.category);
    var time = M.clockLabel(r.when, r.allDay);
    var rel  = M.relativeTime(r.when, now, r.allDay);

    var src = r.event && r.event.source === 'google' ? r.event : null;

    var meta = '';
    if (cat) meta += '<span class="calTag" style="--tag:' + esc(cat.color) + '">'
                   + '<span class="calTagDot" aria-hidden="true"></span>' + esc(cat.label) + '</span>';
    /* Mirrored from Google and not editable here. Said out loud, on the row,
     * rather than discovered when an edit silently does nothing. */
    if (src) meta += '<span class="calSrc" title="From Google Calendar · read-only">Google · read-only</span>';
    if (r.repeat) meta += '<span class="calNote">repeats ' + esc(r.repeat) + '</span>';
    if (r.kind === 'reminder' && !r.when) meta += '<span class="calNote">no date</span>';

    return '<li class="calRow"' + (overdue ? ' data-overdue="true"' : '')
      + (src ? ' data-source="google"' : '') + '>'
      + '<span class="calTime"' + (r.when && !r.allDay ? '' : ' data-allday="true"') + '>'
        + (time || (r.when ? 'all day' : '—')) + '</span>'
      + '<span class="calMain">'
        + '<span class="calTitle">' + esc(r.title || 'Untitled') + '</span>'
        + (meta ? '<span class="calMeta">' + meta + '</span>' : '')
      + '</span>'
      + '<span class="calRel">' + esc(overdue ? (rel || '') + ' · overdue' : (rel || '')) + '</span>'
      + '</li>';
  }

  function groupHtml(g, now){
    return '<li class="calGroup" data-group="' + esc(g.id) + '">'
      + '<h3 class="calGroupLabel">' + esc(g.label) + '</h3>'
      + '<ul class="calRows">' + g.items.map(function(r){ return rowHtml(r, now); }).join('') + '</ul>'
      + '</li>';
  }

  function emptyHtml(){
    return '<div class="calEmpty">'
      + '<h2 class="calEmptyTitle">Nothing scheduled</h2>'
      + '<p class="calEmptyBody">No events or reminders in the next 30 days. '
      + 'Adding them from here is the next step — for now you can drop in a set of '
      + 'sample entries to see how the list behaves.</p>'
      + '<div class="calEmptyActions">'
      + '<button class="btn btn-primary" type="button" id="seedBtn">Add sample data</button>'
      + '</div></div>';
  }

  /* ============================================================
   * Google Calendar connection panel (step 1: auth only).
   *
   * Everything here degrades to nothing: if google-calendar.js failed to load
   * the panel is simply absent, and the list above it is unaffected. Sync is
   * additive, never a dependency.
   * ============================================================ */
  function agoLabel(ts){
    if (!ts) return '';
    return M.relativeTime(new Date(ts), new Date(), false) || '';
  }

  /* Step 2 is "fetch and log": the events are pulled and dumped to the console
   * so the request shape can be checked against real data before any of it is
   * mapped into the model (step 3) or shown in Coming up (step 4). Only the
   * count and any error reach the page. */
  var gcSync = { state:'idle', count:0, at:null, error:'', truncated:false, errors:[] };
  var gcCalendars = null;      // null = not loaded yet, [] = none / failed

  /* Pull every selected calendar and refresh the cache Coming up reads.
   * Never called from render() — only on connect, the manual button, a
   * calendar toggle, or the poll timer. */
  function syncGoogle(){
    if (!window.GoogleCalendar || !GoogleCalendar.status().connected) return;
    if (gcSync.state === 'loading') return;
    gcSync = { state:'loading', count:gcSync.count, at:gcSync.at, error:'', truncated:false, errors:[] };
    render();
    GoogleCalendar.syncAll({ days: 30 }).then(function(res){
      gcSync = { state:'done', count:res.events.length, at:Date.now(), error:'',
                 truncated:res.truncated, errors:res.errors };
      console.log('[google-calendar] %d event(s) across %d calendar(s)', res.events.length, res.calendarIds.length);
      if (res.errors.length) console.warn('[google-calendar] some calendars failed', res.errors);
      render();
    }).catch(function(err){
      gcSync = { state:'error', count:0, at:Date.now(),
                 error:(err && err.message) || 'Could not fetch events.', truncated:false, errors:[] };
      console.warn('[google-calendar] sync failed', err);
      render();
    });
  }

  function loadCalendarList(){
    if (!window.GoogleCalendar || !GoogleCalendar.status().connected) return;
    GoogleCalendar.listCalendars().then(function(list){
      gcCalendars = list; render();
    }).catch(function(e){
      /* Not fatal: without the list you simply cannot re-pick calendars, and
       * the primary one still syncs. */
      console.warn('[google-calendar] could not list calendars', e);
      gcCalendars = []; render();
    });
  }

  function calendarsHtml(){
    if (gcCalendars === null) return '<p class="gcHint">Loading your calendars…</p>';
    if (!gcCalendars.length) return '';
    var selected = GoogleCalendar.selectedCalendars();
    return '<fieldset class="gcCals"><legend class="gcLabel">Calendars to pull</legend>'
      + gcCalendars.map(function(c, i){
          var id = 'gcCal' + i;
          var on = selected.indexOf(c.id) >= 0 || (c.primary && selected.indexOf('primary') >= 0);
          return '<label class="gcCal" for="' + id + '">'
            + '<input type="checkbox" id="' + id + '" data-calid="' + esc(c.id) + '"' + (on ? ' checked' : '') + ' />'
            + (c.backgroundColor ? '<span class="gcCalDot" style="--cal:' + esc(c.backgroundColor) + '" aria-hidden="true"></span>' : '')
            + '<span class="gcCalName">' + esc(c.summary) + '</span>'
            + (c.primary ? '<span class="gcCalTag">primary</span>' : '')
            + '</label>';
        }).join('')
      + '</fieldset>';
  }

  function calErrorsHtml(){
    if (!gcSync.errors || !gcSync.errors.length) return '';
    return '<p class="gcErr" role="alert">' + gcSync.errors.map(function(e){
      return esc(e.calendarId) + ': ' + esc(e.message);
    }).join('<br>') + '</p>';
  }

  function googlePanelHtml(){
    if (!window.GoogleCalendar) return '';
    var s = GoogleCalendar.status();

    var label = { loading:'checking', unconfigured:'not set up', disconnected: s.linked ? 'reconnect' : 'not connected',
                  connecting:'waiting for google', connected:'connected', error:'error' }[s.state] || s.state;

    var body = '', actions = '', meta = '';

    if (s.state === 'unconfigured'){
      body = '<p class="gcBody">This page could not find a Google client ID. On a deploy it comes from the '
           + '<code>GOOGLE_CLIENT_ID</code> environment variable via <code>/api/config</code> — but that endpoint '
           + 'does not exist on localhost, so paste the ID here to test locally. It is stored on this device only '
           + 'and never committed.</p>'
           + '<div class="gcField"><label class="gcLabel" for="gcClientId">OAuth client ID</label>'
           + '<input class="gcInput" id="gcClientId" type="text" autocomplete="off" spellcheck="false" '
           + 'placeholder="1234567890-abc….apps.googleusercontent.com" /></div>'
           + '<p class="gcHint">A client ID is public by design. Never paste the client secret — nothing here uses it.</p>';
      actions = '<button class="btn btn-primary" type="button" id="gcSaveId">Save client ID</button>';
    } else if (s.state === 'connected'){
      var nCal = GoogleCalendar.selectedCalendars().length;
      var note = gcSync.state === 'loading'
          ? 'Syncing the next 30 days…'
        : gcSync.state === 'done'
          ? 'Showing <strong>' + gcSync.count + '</strong> event' + (gcSync.count === 1 ? '' : 's')
            + ' from ' + nCal + ' calendar' + (nCal === 1 ? '' : 's') + ' in “Coming up” above, marked read-only. '
            + 'Your own events are stored separately and are never touched by a sync.'
            + (gcSync.truncated ? ' <em>More exist than were fetched.</em>' : '')
        : 'Connected with read-only access.';
      body = '<p class="gcBody">' + note + '</p>';
      if (gcSync.state === 'error') body += '<p class="gcErr" role="alert">' + esc(gcSync.error) + '</p>';
      body += calErrorsHtml();
      body += calendarsHtml();
      actions = '<button class="btn btn-primary" type="button" id="gcSync"' + (gcSync.state === 'loading' ? ' disabled' : '') + '>'
              + (gcSync.state === 'loading' ? 'Syncing…' : 'Sync now') + '</button>'
              + '<button class="btn btn-ghost" type="button" id="gcDisconnect">Disconnect</button>';
      meta = s.lastSyncAt ? 'synced ' + agoLabel(s.lastSyncAt) + ' · auto every 10 min' : 'not synced yet';
    } else if (s.state === 'connecting'){
      body = '<p class="gcBody">Waiting for the Google sign-in window…</p>';
      actions = '<button class="btn btn-ghost" type="button" id="gcCancel">Cancel</button>';
    } else if (s.state === 'loading'){
      body = '<p class="gcBody">Starting up…</p>';
    } else {
      /* disconnected, or error that the user can retry out of */
      body = s.linked
        ? '<p class="gcBody">Your Google session has ended. Access tokens last about an hour and, in a browser-only '
          + 'app like this one, cannot be renewed without a click — so reconnecting now and then is normal, not a fault.</p>'
        : '<p class="gcBody">Connect your Google Calendar to see its events alongside the ones you add here. '
          + 'Read-only: nothing on your calendar is changed.</p>';
      actions = '<button class="btn btn-primary" type="button" id="gcConnect">' + (s.linked ? 'Reconnect' : 'Connect Google Calendar') + '</button>';
      if (s.linked) actions += '<button class="btn btn-ghost btn-sm" type="button" id="gcForget">Forget this account</button>';
      if (s.lastConnectedAt) meta = 'last connected ' + agoLabel(s.lastConnectedAt);
    }

    var err = s.error ? '<p class="gcErr" role="alert">' + esc(s.error) + '</p>' : '';

    return '<section class="calCard" aria-labelledby="gcHead">'
      + '<div class="gcHead"><h2 class="calEyebrow" id="gcHead">Google Calendar</h2>'
      + '<span class="gcStatus" data-state="' + esc(s.state) + '"><span class="gcDot" aria-hidden="true"></span>' + esc(label) + '</span></div>'
      + err + body
      + (actions || meta
          ? '<div class="calFoot"><span class="gcMeta">' + esc(meta) + '</span><span class="gcActions">' + actions + '</span></div>'
          : '')
      + '</section>';
  }

  /* Mirrored Google events, or nothing at all. Every failure mode — module
   * missing, cache empty, cache corrupt, Google disconnected, API down —
   * arrives here as an empty array, so the list below renders your local
   * events exactly as it did before Google existed. Sync is additive. */
  function googleEvents(){
    try { return window.GoogleCalendar ? GoogleCalendar.cachedEvents() : []; }
    catch(e){ return []; }
  }

  /* ---- Render ---- */
  function render(){
    var now = new Date();
    var events = Store.loadEvents();
    var reminders = Store.loadReminders();
    var gEvents = googleEvents();
    var rows = M.upcoming(events.concat(gEvents), reminders, { now: now, days: 30 });
    var groups = M.groupUpcoming(rows, now);
    var total = events.length + reminders.length;

    var body = rows.length
      ? '<ul class="calList">' + groups.map(function(g){ return groupHtml(g, now); }).join('') + '</ul>'
      : ((total || gEvents.length) ? nothingUpcomingHtml() : emptyHtml());

    var footNote = total + ' saved';
    if (gEvents.length) footNote += ' · ' + gEvents.length + ' from Google';
    footNote += ' · next 30 days';

    var foot = (total || gEvents.length)
      ? '<div class="calFoot"><span class="calFootNote">' + footNote + '</span>'
        + (total ? '<button class="btn btn-ghost btn-sm" type="button" id="clearBtn">Remove sample data</button>' : '')
        + '</div>'
      : '';

    /* A full redraw throws away focus. Remember where it was and put it back,
     * so toggling a calendar with the keyboard doesn't dump you at the top of
     * the page. */
    var focusId = '', selStart = null, selEnd = null;
    try {
      var act = document.activeElement;
      if (act && act.id){
        focusId = act.id;
        if (act.selectionStart != null){ selStart = act.selectionStart; selEnd = act.selectionEnd; }
      }
    } catch(e){}

    document.getElementById('app').innerHTML =
        '<section class="calCard" aria-labelledby="comingHead">'
      + '<div class="calCardHead"><h2 class="calEyebrow" id="comingHead">Coming up</h2>'
      + (rows.length ? '<span class="calCount">' + rows.length + ' item' + (rows.length === 1 ? '' : 's') + '</span>' : '')
      + '</div>'
      + body + foot
      + '</section>'
      + googlePanelHtml();

    wire();

    if (focusId){
      try {
        var back = document.getElementById(focusId);
        if (back){
          back.focus();
          if (selStart != null && back.setSelectionRange) back.setSelectionRange(selStart, selEnd);
        }
      } catch(e){}
    }
  }

  /* Saved entries exist, but none of them fall in the window — a different
   * message from "you have nothing at all", because the fix is different. */
  function nothingUpcomingHtml(){
    return '<div class="calEmpty">'
      + '<h2 class="calEmptyTitle">Nothing in the next 30 days</h2>'
      + '<p class="calEmptyBody">Everything you have saved is either already done or further out than a month.</p>'
      + '</div>';
  }

  function wire(){
    var seed = document.getElementById('seedBtn');
    if (seed) seed.addEventListener('click', seedSamples);
    var clear = document.getElementById('clearBtn');
    if (clear) clear.addEventListener('click', clearSamples);

    if (!window.GoogleCalendar) return;
    on('gcConnect',    function(){ GoogleCalendar.connect(); });
    on('gcSync',       syncGoogle);
    on('gcDisconnect', function(){ GoogleCalendar.disconnect(); });
    on('gcCancel',     function(){ render(); });
    on('gcForget',     function(){ GoogleCalendar.disconnect(); });
    on('gcSaveId',     function(){
      var el = document.getElementById('gcClientId');
      if (el) GoogleCalendar.setClientId(el.value);
    });
    /* Enter submits the client-ID field — it is the only input on the page and
     * should not need a mouse. */
    var idField = document.getElementById('gcClientId');
    if (idField) idField.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); GoogleCalendar.setClientId(idField.value); }
    });

    /* Calendar toggles. Native checkboxes, so tab and space already work. */
    var boxes = document.querySelectorAll('.gcCals input[type="checkbox"]');
    for (var i = 0; i < boxes.length; i++){
      boxes[i].addEventListener('change', function(){
        var picked = [];
        var all = document.querySelectorAll('.gcCals input[type="checkbox"]');
        for (var j = 0; j < all.length; j++) if (all[j].checked) picked.push(all[j].getAttribute('data-calid'));
        GoogleCalendar.setSelectedCalendars(picked);
        syncGoogle();
      });
    }
  }

  function on(id, fn){
    var el = document.getElementById(id);
    if (el) el.addEventListener('click', fn);
  }

  /* ============================================================
   * Sample data — explicit, never automatic.
   *
   * This writes to real, synced storage, so it is behind a button and never
   * runs on load. A page that seeds itself while booting looks to the sync
   * engine exactly like an edit you just made, and being newest it wins —
   * which is how a laptop left closed for two days once overwrote what a
   * phone had saved. See sync-boot.js.
   *
   * Every sample carries a fixed `sample` id prefix so re-seeding overwrites
   * rather than duplicating, and "Remove sample data" can take out exactly
   * these rows and nothing you typed yourself.
   * ============================================================ */
  var SAMPLE = /^(evt|rem)_sample_/;

  function stamp(daysFromNow, hhmm){
    var d = M.addDays(new Date(), daysFromNow);
    return M.dateKey(d) + (hhmm ? 'T' + hhmm : '');
  }

  function seedSamples(){
    [ { id:'evt_sample_1', title:'Dentist',            start:stamp(0, '15:30'), category:'health' },
      { id:'evt_sample_2', title:'Team standup',       start:stamp(1, '09:00'), category:'work' },
      { id:'evt_sample_3', title:'Dinner with Anna',   start:stamp(2, '19:00'), category:'social' },
      { id:'evt_sample_4', title:'Flight to Berlin',   start:stamp(9),          category:'social' },
      { id:'evt_sample_5', title:'Quarterly review',   start:stamp(21,'11:00'), category:'work' }
    ].forEach(function(e){ Store.saveEvent(M.makeEvent(e)); });

    [ { id:'rem_sample_1', title:'Renew passport',     due:stamp(-3),           category:'admin' },
      { id:'rem_sample_2', title:'Take vitamin D',     due:stamp(0, '08:00'),   repeat:'daily',   category:'health' },
      { id:'rem_sample_3', title:'Put the bins out',   due:stamp(1, '07:30'),   repeat:'weekly',  category:'admin' },
      { id:'rem_sample_4', title:'Pay rent',           due:stamp(16),           repeat:'monthly', category:'money' },
      { id:'rem_sample_5', title:'Learn Rust' }
    ].forEach(function(r){ Store.saveReminder(M.makeReminder(r)); });

    render();
  }

  function clearSamples(){
    Store.loadEvents().forEach(function(e){ if (SAMPLE.test(e.id)) Store.removeEvent(e.id); });
    Store.loadReminders().forEach(function(r){ if (SAMPLE.test(r.id)) Store.removeReminder(r.id); });
    render();
  }

  /* ---- Boot ---- */
  render();

  /* Another device changed something — re-render in place rather than letting
   * the sync engine fall back to reloading the page. */
  Store.onChange(function(){ try { render(); } catch(e){} });

  /* Connection state changed — same treatment. */
  if (window.GoogleCalendar){
    var wasConnected = false;
    GoogleCalendar.onChange(function(s){
      try {
        /* Sync once on the transition into connected, so authorising is a
         * single click rather than two, and load the calendar list alongside. */
        if (s.connected && !wasConnected){
          gcCalendars = null;
          loadCalendarList();
          syncGoogle();
        }
        if (!s.connected){
          gcSync = { state:'idle', count:0, at:null, error:'', truncated:false, errors:[] };
          gcCalendars = null;
        }
        wasConnected = s.connected;
        render();
      } catch(e){}
    });
    try { GoogleCalendar.init(); } catch(e){}

    /* Poll rather than refetch on render. Ten minutes is well inside the
     * ~1-hour token life, so a tab left open stays current until the token
     * dies — at which point the sync 401s, the panel flips to "reconnect",
     * and the cached events stay on screen instead of vanishing.
     *
     * Skipped while the tab is hidden: a backgrounded dashboard has no reason
     * to spend your API quota. */
    setInterval(function(){
      try {
        if (document.hidden) return;
        if (!GoogleCalendar.status().connected) return;
        syncGoogle();
      } catch(e){}
    }, 10 * 60 * 1000);
  }

  /* "in 2 hours" goes stale on a page left open. Cheap enough to just redraw —
   * except while the client-ID field is being typed into, since a full redraw
   * would swallow the keystrokes mid-paste. */
  setInterval(function(){
    try {
      var a = document.activeElement;
      if (a && a.id === 'gcClientId') return;
      render();
    } catch(e){}
  }, 60000);
})();
</script>
